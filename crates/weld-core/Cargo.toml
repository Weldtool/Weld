[package]
name = "weld-core"
version = "0.1.0"
edition = "2024"

[features]
default = []
sqlx = ["dep:sqlx"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
thiserror = "2"
sqlx = { version = "0.8", features = ["postgres"], optional = true }
