name: CI

on:
  push:
    branches: [Production, Dev]
  pull_request:
    branches: [Production, Dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  rust-fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
      JWT_SECRET: test-secret-do-not-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -W clippy::all

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          SQLX_OFFLINE: "true"
          POSTGRES_USER: weld
          POSTGRES_PASSWORD: weld
          POSTGRES_DB: weld_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U weld"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SQLX_OFFLINE: "true"
      JWT_SECRET: test-secret-do-not-use-in-production
      DATABASE_URL: postgres://weld:weld@localhost:5432/weld_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres
      - name: Run migrations
        run: sqlx migrate run
        working-directory: crates/weld-server
      - name: Run tests
        run: cargo test --workspace

  web-check:
    name: Web Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Check if web app exists
        id: check
        run: |
          if [ ! -f apps/web/package.json ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      # Version comes from `packageManager` in apps/web/package.json so CI and
      # local can't drift. They had: CI pinned pnpm 9, which reads overrides
      # from package.json, while developers ran pnpm 11, which reads them from
      # pnpm-workspace.yaml and ignores the package.json field entirely.
      - if: steps.check.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - if: steps.check.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.skip != 'true'
        name: Svelte check
        run: pnpm check
      - if: steps.check.outputs.skip != 'true'
        name: Lint
        run: pnpm lint
      - if: steps.check.outputs.skip != 'true'
        name: Unit tests
        run: pnpm test
      # The Rust side has audited since day one; the npm side never did, so the
      # only thing catching advisories here was Dependabot filing a PR.
      - if: steps.check.outputs.skip != 'true'
        name: Audit npm dependencies
        run: pnpm audit

  security-audit:
    name: Security Audit
    permissions:
      checks: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
