<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#4f46e5"/>
  <!-- Bottom chain link -->
  <rect x="12" y="15" width="18" height="10" rx="5" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Cover to create interlocking effect -->
  <rect x="10" y="13" width="12" height="6" fill="#4f46e5"/>
  <!-- Top chain link -->
  <rect x="2" y="7" width="18" height="10" rx="5" fill="none" stroke="white" stroke-width="2.5"/>
</svg>
